# End-to-end tests: a real browser clicks through the app.
# By default the runner starts its own throwaway Supabase (tests/local/start.sh: every migration, the test-only
# SQL, the e2e leads) and tests against that, so a run costs the TEST project nothing (owner, 2026-10-03:
# stop clogging Supabase). db=test runs against the TEST project instead: the check before a big change goes live.
#   - push to test:       nothing (owner, 2026-10-03); start a run by hand when a batch is ready
#   - nightly:            the full suite (local), only if test changed in the last 24 hours
#   - pull request:       the full suite (local)
#   - by hand:            gh workflow run e2e.yml --ref test -f suite=quick   (smoke + security; or suite=full)
#   - by hand, middle:    gh workflow run e2e.yml --ref test -f suite=some -f specs="groups post"
#                         (the quick suite plus those spec files: e2e/groups.spec.js, e2e/post.spec.js)
#   - on TEST:            add -f db=test (e.g. gh workflow run e2e.yml --ref test -f suite=full -f db=test)
# Tests run 2 at a time on CI (workers: 2 in playwright.config.js); each worker signs in as its own leads.
# Merging to main needs, on that commit: a green quick run (small change), a green middle run with the
# touched specs (medium change) or a green full run on TEST (big change). The tiers are in CLAUDE.md (Tests).
# Not on main: main only ever fast-forwards to a commit that already passed on test.
# Scheduled runs use this file as it is on main, so changes to the nightly only apply once merged.

name: End-to-end tests

on:
  pull_request:
    paths-ignore: ['**.md', 'design/**', 'scripts/**', 'icons/**', 'supabase/templates/**', 'supabase/test-only/**', '.vercelignore', '.github/workflows/keep-supabase-awake.yml']
  schedule:
    - cron: "30 9 * * *"   # nightly, 09:30 UTC (early morning in the US)
  workflow_dispatch:
    inputs:
      suite:
        description: 'quick (smoke + security), some (quick + the specs below) or full'
        type: choice
        options: [full, quick, some]
        default: full
      specs:
        description: 'for some: spec names, space-separated (e.g. groups post)'
        type: string
        default: ''
      db:
        description: 'local (a throwaway Supabase on the runner) or test (the TEST project)'
        type: choice
        options: [local, test]
        default: local

# The workflow only needs to read the repo
permissions:
  contents: read

# db=test runs share the TEST project, so never run two at once (GitHub drops a waiting run when a newer one queues).
# Local runs each have their own database, so they don't wait for each other.
concurrency:
  group: ${{ inputs.db == 'test' && 'e2e' || format('e2e-local-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Decides which tests run (or none, for a nightly with nothing new on test)
  pick:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      files: ${{ steps.pick.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'test' || '' }}
      - id: pick
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          suite=full; run=true
          case "${{ github.event_name }}" in
            workflow_dispatch) suite="${{ inputs.suite }}" ;;
            schedule) [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 86400 ] || run=false ;;
          esac
          files=""
          [ "$suite" = quick ] || [ "$suite" = some ] && files="e2e/smoke.spec.js e2e/security.spec.js"
          if [ "$suite" = some ]; then
            for n in $SPECS; do
              case "$n" in *[!a-z0-9-]*) echo "Bad spec name: $n"; exit 1 ;; esac
              [ -f "tests/e2e/$n.spec.js" ] || { echo "No such spec: $n"; exit 1; }
              case " $files " in *" e2e/$n.spec.js "*) ;; *) files="$files e2e/$n.spec.js" ;; esac
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Suite: $suite${files:+ ($files)}, database: ${{ inputs.db == 'test' && 'TEST' || 'local' }}, run: $run" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25   # starting the local Supabase adds a few minutes
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'test' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      # Chromium is cached per Playwright version; the system libraries it needs are installed every time
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The runner's own Supabase (Docker): the default, so the run never touches TEST
      - uses: supabase/setup-cli@v1
        if: inputs.db != 'test'
        with:
          version: 2.119.0
      - name: Start a local Supabase
        if: inputs.db != 'test'
        run: local/start.sh
        env:
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}

      - name: Run tests
        run: npx playwright test ${{ needs.pick.outputs.files }}
        env:
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}
          E2E_DB: ${{ inputs.db == 'test' && 'test' || 'local' }}

      # Traces record page.evaluate arguments and request bodies, which include the leads' password.
      # CI records none (trace is off when CI is set, playwright.config.js), and as a second guard every
      # zip is deleted before uploading: the HTML report keeps its own copies under playwright-report/data.
      # The repo is public, so only the report, screenshots and error context are kept.
      - name: Drop traces before uploading
        if: failure()
        run: |
          find test-results playwright-report -name '*.zip' -delete 2>/dev/null || true
          if [ -n "$E2E_LEAD_PASSWORD" ] && grep -rIl --exclude='*.png' -F "$E2E_LEAD_PASSWORD" test-results playwright-report 2>/dev/null; then
            echo 'The leads password is in the files above; not uploading anything'; rm -rf test-results playwright-report
          fi
        env:
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
