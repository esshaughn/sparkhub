# End-to-end tests: a real browser clicks through the app against the TEST database.
# Runs on every push to test/main and on pull requests. A red ✗ on GitHub means don't merge.

name: End-to-end tests

on:
  push:
    branches: [test, main]
  pull_request:
  workflow_dispatch: {}

# The workflow only needs to read the repo
permissions:
  contents: read

# Runs share one test database, so never run two at once
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        env:
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}

      # Traces record page.evaluate arguments and request bodies, which include the leads' password;
      # the repo is public, so keep only the report, screenshots and error context
      - name: Drop traces before uploading
        if: failure()
        run: find test-results -name 'trace.zip' -delete || true

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
