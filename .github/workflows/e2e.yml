# End-to-end tests: a real browser clicks through the app against the TEST database.
# Runs on every push to test and on pull requests. A red ✗ on GitHub means don't merge.
# Not on main: main only ever fast-forwards to a commit that already passed on test, and a second
# run there just holds the shared test database while the next push to test waits.
# Changes to docs (*.md) and the design folder alone don't need a browser run.

name: End-to-end tests

on:
  push:
    branches: [test]
    paths-ignore: ['**.md', 'design/**']
  pull_request:
    paths-ignore: ['**.md', 'design/**']
  workflow_dispatch: {}

# The workflow only needs to read the repo
permissions:
  contents: read

# Runs share one test database, so never run two at once
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      # Chromium is cached per Playwright version; the system libraries it needs are installed every time
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npx playwright test
        env:
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}

      # Traces record page.evaluate arguments and request bodies, which include the leads' password;
      # the repo is public, so keep only the report, screenshots and error context
      - name: Drop traces before uploading
        if: failure()
        run: find test-results -name 'trace.zip' -delete || true

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
