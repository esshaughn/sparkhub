const PH = '../../assets/photos/';

ReactDOM.createRoot(document.getElementById('root')).render(<div style={{maxWidth:380,display:'flex',flexDirection:'column',gap:10}}><Card><RsvpTiles value={null} /><FaceStack faces={[{src:PH+'faces/hana.jpg'},{src:PH+'faces/dee.jpg'},{src:PH+'faces/darnell.jpg'}]} label="17 going · 3 maybe" /></Card><RsvpStatus value="going" /><RsvpStatus value="maybe" /><RsvpStatus value="no" /><RsvpStatus value="lead" /></div>);}).catch(e=>{document.body.insertAdjacentHTML("beforeend","<pre>"+(e&&e.stack||e)+"</pre>")});
