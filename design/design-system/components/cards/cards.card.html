<!-- @dsCard group="Components" viewport="700x400" name="Cards" subtitle="Card, list rows, Next up, gradient cards" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../components/load.js"></script>
<style>body{background:var(--surface-page);padding:18px;margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const R = ({children,gap=10,col}) => <div style={{display:'flex',flexDirection:col?'column':'row',flexWrap:'wrap',gap,alignItems:col?'stretch':'center'}}>{children}</div>;
const PH = '../../assets/photos/';
loadSparkHub('../../').then(NS => { const {Icon,Sparkles,Sparkle,Wordmark,Button,IconButton,Fab,PlusMenuPill,Chip,ChipRow,FilterPill,Tag,Face,FaceStack,Card,SectionLabel,ListRow,NextUpCard,EventCard,IdeaCard,GradientCard,BottomSheet,Popup,Toast,Menu,NotePaper,Snapshot,GraphPaper,RsvpTiles,RsvpStatus,TabBar,ScreenHeader,Field,Toggle,Checkbox,ICON_NAMES} = NS;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <NextUpCard photo={PH+'activate.jpg'} when="THU, OCT 15 · 6PM" title="Activate" sub="Torrez · you’re helping" />
      <Card tone="goldTop" gap={10} padding="18px 16px"><span style={{fontSize:13,fontWeight:900,letterSpacing:'1.5px',color:'var(--gold-700)'}}>NEEDS A LEAD</span><span style={{fontSize:20,lineHeight:1.2,fontWeight:900,letterSpacing:'-.3px'}}>Hana floated this and is looking for someone to run it.</span><Button variant="gold" size="md" full>Offer to lead</Button></Card>
      <Card tone="empty"><span style={{fontSize:15,fontWeight:700,color:'var(--grey-700)'}}>Empty section (#dfe2e7)</span></Card>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <GradientCard kind="allGroups" title="All groups" sub="All events, plans & ideas" thumbs={[PH+'torrez-group.jpg',PH+'pickleball.jpg',PH+'mutual-aid.jpg',PH+'projects.jpg']} />
      <GradientCard kind="impact" stats={[[4,'led'],[6,'helped'],[2,'attended']]} />
      <Card padding={0} gap={0} radius={16}><ListRow first role="draft" title="Drafts" count={2} /><ListRow role="idea" title="Ideas" count={3} /><ListRow role="lead" title="Leading" count={2} /><ListRow role="past" title="Past" count={9} /></Card>
    </div>
  </div>);}).catch(e=>{document.body.insertAdjacentHTML("beforeend","<pre>"+(e&&e.stack||e)+"</pre>")});
</script></body></html>
