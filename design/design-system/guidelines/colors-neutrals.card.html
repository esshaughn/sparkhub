<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Ink, greys, page grey" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div class="row"><div class="sw"><i style="background:var(--ink)"></i><b>Ink</b><span>#0d1117</span></div><div class="sw"><i style="background:var(--grey-700)"></i><b>Body</b><span>#454b55</span></div><div class="sw"><i style="background:var(--grey-600)"></i><b>Muted</b><span>#6b7280</span></div><div class="sw"><i style="background:var(--grey-500)"></i><b>Quiet</b><span>#9aa0ac</span></div><div class="sw"><i style="background:var(--grey-400)"></i><b>Placeholder</b><span>#b9bcc4</span></div><div class="sw"><i style="background:var(--grey-200)"></i><b>Field ring</b><span>#dcdfe6</span></div><div class="sw"><i style="background:var(--grey-100)"></i><b>Page</b><span>#e8eaee</span></div><div class="sw"><i style="background:var(--grey-50)"></i><b>Inset</b><span>#f2f3f6</span></div></div>
</body></html>
