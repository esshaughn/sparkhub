<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div style="background:var(--surface-page);margin:-18px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div class="sh-note-paper sh-torn" style="height:130px"></div><div class="lbl" style="margin-top:6px">tex-note + torn-edge · slide-up top</div></div><div><div style="height:130px;border-radius:6px;background-color:var(--paper);background-image:var(--tex-note-soft);box-shadow:var(--shadow-snapshot);position:relative;overflow:hidden"><div style="height:5px;background:var(--gold-edge)"></div></div><div class="lbl" style="margin-top:6px">tex-note-soft · idea card, 5px gold edge</div></div></div>
</body></html>
