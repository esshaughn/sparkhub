<!-- @dsCard group="Colors" viewport="700x240" name="Role tints + text" subtitle="Bands, strips and the text that sits on them" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div style="background:var(--purple-50);color:var(--purple-600);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">You’re leading</span><span class="lbl" style="color:inherit;opacity:.8">#f3f1fe / #4a3ad4</span></div><div style="background:var(--green-50);color:var(--green-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">You’re going</span><span class="lbl" style="color:inherit;opacity:.8">#e7f6ec / #0f7a3c</span></div><div style="background:var(--gold-100);color:var(--gold-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">You’re a maybe</span><span class="lbl" style="color:inherit;opacity:.8">#fdf1d6 / #8f6405</span></div><div style="background:var(--orange-50);color:var(--orange-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">3 ways to help ›</span><span class="lbl" style="color:inherit;opacity:.8">#fff1e8 / #b8480c</span></div><div style="background:var(--pink-50);color:var(--pink-500);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">Post update</span><span class="lbl" style="color:inherit;opacity:.8">#fdf0f5 / #d6246e</span></div><div style="background:var(--gold-50);color:var(--gold-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">REQUEST</span><span class="lbl" style="color:inherit;opacity:.8">#fff4dc / #8f6405</span></div><div style="background:var(--blue-50);color:var(--blue-500);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">Invite others</span><span class="lbl" style="color:inherit;opacity:.8">#eaf3fc / #1f5fa8</span></div><div style="background:var(--grey-50);color:var(--grey-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">You can’t make it</span><span class="lbl" style="color:inherit;opacity:.8">#f2f3f6 / #454b55</span></div><div style="background:var(--red-50);color:var(--red-700);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">Couldn’t load</span><span class="lbl" style="color:inherit;opacity:.8">#fdeef0 / #9b1c31</span></div></div>
</body></html>
