<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div><div style="height:64px;border-radius:12px;background:var(--hatch-maybe)"></div><div class="lbl" style="margin-top:6px">maybe strip</div></div><div><div style="height:64px;border-radius:12px;background:var(--hatch-gold)"></div><div class="lbl" style="margin-top:6px">maybe picked</div></div><div><div style="height:64px;border-radius:12px;background:var(--hatch-gold-strong)"></div><div class="lbl" style="margin-top:6px">gold strong</div></div><div><div style="height:64px;border-radius:12px;background:var(--hatch-placeholder)"></div><div class="lbl" style="margin-top:6px">placeholder</div></div></div>
</body></html>
