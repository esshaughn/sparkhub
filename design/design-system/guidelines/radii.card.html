<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Pills everywhere; cards 18–22; pop-ups 24" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div class="row" style="gap:14px"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:999px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">999px pill</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:6px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">6px paper</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:10px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">10px menu opt</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:14px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">14px field · toast</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:16px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">16px menu</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:18px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">18px card</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:20px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">20px card-lg</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:22px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">22px tile</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:52px;border-radius:24px;background:var(--grey-100);box-shadow:inset 0 0 0 1.5px var(--grey-200)"></div><span class="lbl">24px pop-up</span></div></div>
</body></html>
