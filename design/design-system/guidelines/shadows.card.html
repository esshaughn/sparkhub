<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Whisper card shadow → pop-up" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}.sw{width:84px;display:flex;flex-direction:column;gap:5px}.sw i{display:block;height:52px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(13,17,23,.06)}
.sw b{font-size:12px;font-weight:800}.sw span{font-size:10.5px;font-weight:600;color:var(--grey-600);font-family:ui-monospace,monospace}
.lbl{font-size:10.5px;font-weight:700;color:var(--grey-600);font-family:ui-monospace,monospace}</style></head><body>
<div style="background:var(--surface-page);margin:-18px;padding:24px;display:flex;gap:18px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-card)"></div><span class="lbl">card</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-card-hover)"></div><span class="lbl">card hover</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-paper)"></div><span class="lbl">paper</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-menu)"></div><span class="lbl">menu</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-popup)"></div><span class="lbl">pop-up</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:76px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow-fab)"></div><span class="lbl">fab</span></div></div>
</body></html>
